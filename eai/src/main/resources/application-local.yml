server:
  port: 8085

spring:
  jmx:
    enabled: true # additionally must set -Djava.rmi.server.hostname=localhost to use local debugging via JMX+RMI

management:
  endpoints:
    access:
      default: unrestricted
  endpoint:
    health:
      show-details: always

logging:
  include-application-group: false # disabled because application group is only relevant when deployed
  structured:
    format:
      console: # set to empty to disable structured logging locally
  level:
    root: INFO
    de.muenchen.oss.refarch: DEBUG
    org.springframework.cache: TRACE
    org.springframework.web: DEBUG