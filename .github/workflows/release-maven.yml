# Workflow to release Maven-based artifacts
name: release-maven

on:
  workflow_dispatch:
    inputs:
      release-method:
        type: choice
        description: "Release method. Allowed values: patch, minor or major"
        required: true
        options:
          - patch
          - minor
          - major
      release-version:
        description: "Version to use when preparing a release (e.g., 1.2.3)"
        required: false
        default: ""
      app-path:
        type: choice
        description: Service-Name
        required: true
        options: # Add or modify paths according to your project structure
          - backend
          - eai

jobs:
  release-maven-artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # must be removed if use-pr is 'false'
    outputs:
      MVN_ARTIFACT_ID: ${{ steps.release-maven-artifact.outputs.MVN_ARTIFACT_ID }}
      ARTIFACT_NAME: ${{ steps.release-maven-artifact.outputs.artifact-name }}
      RELEASE_VERSION: ${{ steps.release-maven-artifact.outputs.release-version}}
    steps:
      - id: release-maven-artifact
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-release@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        with:
          app-path: ${{ inputs.app-path }}
          releaseVersion: ${{ inputs.release-version }}
          release-method:  ${{ inputs.release-method }}
          use-pr: "true"
          # the following variables are necessary to publish the packages to maven central
          # docs: https://it-at-m.github.io/lhm_actions/workflows.html#maven-central
          # skipDeployment: false
          # SIGN_KEY_PASS: ${{ secrets.gpg_passphrase }}
          # CENTRAL_USERNAME: ${{ secrets.sonatype_username }}
          # CENTRAL_PASSWORD: ${{ secrets.sonatype_password }}
          # GPG_PRIVATE_KEY: ${{ secrets.gpg_private_key }}

  release-maven-image:
    runs-on: ubuntu-latest
    needs: release-maven-artifact
    permissions:
      packages: write
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        with:
          path: ${{ inputs.app-path }}
          artifact-name: ${{ needs.release-maven-artifact.outputs.ARTIFACT_NAME }}
          image-name: ${{ inputs.app-path }}
          image-tags: |
            type=semver,pattern={{version}},value=${{ needs.release-maven-artifact.outputs.RELEASE_VERSION}}
            type=raw,value=latest
          platforms: "linux/amd64,linux/arm64"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

  release-maven-github:
    needs: [release-maven-artifact, release-maven-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-create-github-release@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        with:
          artifact-name: ${{ needs.release-maven-artifact.outputs.ARTIFACT_NAME }}
          artifact-path: ${{ inputs.app-path }}/target/*.jar
          tag-name: ${{ inputs.app-path }}-${{ needs.release-maven-artifact.outputs.RELEASE_VERSION}}
          generate-release-notes: true
