# Workflow to build docs and deploy docs folder to GitHub pages
name: deploy-docs

on:
  # Runs on pushes to any branch when changes are made to docs or workflow
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
      timezone: "Europe/Berlin"


jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-build-docs@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
      - name: Run Trivy vulnerability scanner in fs mode
        uses: it-at-m/lhm_actions/action-templates/actions/action-trivy@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        with:
         path: "docs"
      # Only deploy documentation from the main branch to prevent unauthorized changes
      - if: ${{ github.event_name != 'schedule' }}    
        uses: it-at-m/lhm_actions/action-templates/actions/action-deploy-docs@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
