# Workflow for scanning GitHub workflows with actionlint
name: actionlint

on:
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # needed to annotate the files in a pull request with comments
      pull-requests: write
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-actionlint@e967c9de8fb0197faf7a294d153efa76de5cec27 # v1.6.0
