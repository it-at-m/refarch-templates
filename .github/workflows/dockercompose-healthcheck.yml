# Workflow to check health of dockercompose based development stacks
name: dockercompose-healthcheck

on:
  pull_request:

jobs:
  dockercompose-healthcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-dockercompose-healthcheck@808f574bd8867b31524b254679fc34fb1fd78ea2 # v1.6.2
        with:
          compose-file-path: "./stack/"
