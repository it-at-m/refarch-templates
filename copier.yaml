_subdirectory: "{{ '' if module_type == 'project' else module_type }}"

module_type:
  type: str
  help: Which template would you like to use?
  choices:
    - project
    - backend
    - docs
    - eai
    - frontend
    - webcomponent

project_name:
  type: str
  help: "Project Name"

project_slug:
  type: str
  help: "Project Slug"
  default: "{{
      project_name
        | lower
        | replace('ä', 'ae')
        | replace('ö', 'oe')
        | replace('ü', 'ue')
        | replace('ß', 'ss')
        | regex_replace('[^a-z0-9]+', '-')
        | trim('-')
    }}"

modules:
  type: str
  help: Which modules should the project contain?
  multiselect: true
  choices:
    - backend
    - docs
    - eai
    - frontend
    - webcomponent
  when: "{{ module_type == 'project' }}"

module_name:
  type: str
  help: "{{ module_type | capitalize }}: Module Name"
  default: "{{ module_type }}"
  when: "{{ module_type != 'project' }}"

java_package:
  type: str
  help: "{{ module_type | capitalize }}: Java Package Name"
  default: "de.muenchen.oss.{{ project_slug | replace('-', '') }}.{{ module_type }}"
  when: "{{ module_type in [ 'backend', 'eai' ] }}"
  validator: >-
    {% if not (java_package | regex_search('^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$')) %}
    Must be a valid lowercase Java package, e.g. de.muenchen.oss.myproject.backend
    {% endif %}

_exclude:
  - /.git
  - /.copier
  - /copier.yaml
  - /package.lock
  - /backend
  - /docs
  - /eai
  - /frontend
  - /webcomponent

_tasks:

  # Project
  - command:
      - "{{ _copier_python }}"
      - "{{ _copier_conf.src_path }}/.copier/generate_modules.py"
      - "{{ _copier_conf.src_path }}"
      - "{{ _copier_answers._src_path }}"
      - "{{ project_name }}"
      - "{{ project_slug }}"
      - "{{ modules | join(',') }}"
    when: "{{ _copier_operation == 'copy' and module_type == 'project' }}"

  # Java
  - command:
      - "{{ _copier_python }}"
      - "{{ _copier_conf.src_path }}/.copier/replace.py"
      - "{{ module_type }}"
      - "{{ java_package }}"
      - "{{ project_slug }}"
    when: "{{ module_type in [ 'backend', 'eai' ] }}"

  # Project
  - command:
      - git
      - init
      - --initial-branch=main
    when: "{{ _copier_operation == 'copy' and module_type == 'project' }}"
  - command:
    - git
    - add
    - -A
    when: "{{ _copier_operation == 'copy' and module_type == 'project' }}"
